# HOM-1134: weekly updates, minor and patch grouped, max 3 open PRs per repo (2 + 1), CI tests each PR.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
