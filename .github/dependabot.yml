# HOM-1134: weekly updates, minor and patch grouped, max 3 open PRs per repo (2 + 1), CI tests each PR.
# cooldown: wait 7 days after a release before proposing it (HOM-1523). Security updates are not delayed.
# github-actions PRs that touch deploy.yml are risk:security: need Sam sign-off, never auto-merge.
# github-actions PRs that only touch ci.yml/security.yml follow the HOM-1401 CI-only exception.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
