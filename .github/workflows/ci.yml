name: CI

# PR checks on a GitHub-hosted runner: build the site so a broken PR shows up
# before merge. Nothing is uploaded or deployed; deploy.yml (push to main)
# stays the only workflow that publishes to Pages.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build with Astro
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
        run: npm run build
