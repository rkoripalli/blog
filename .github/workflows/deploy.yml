# Build the Astro site and deploy it to GitHub Pages.
name: Deploy blog to Pages

on:
  # Every push to main publishes the site
  push:
    branches: ["main"]
  # Allows running this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel a deployment that's already running.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
      - name: Build with Astro
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    # HOM-544: deploy only pushes made by Rohan or by Ada's merge bot. Agent
    # GitHub Apps have no Workflows permission, so they cannot edit this line;
    # a bot push to main lands but does not deploy until Ada reverts it.
    if: github.actor == 'rkoripalli' || github.actor == 'rk-ada-lovelace-bytes[bot]'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # HOM-1134: status codes only. Pages can lag the workflow by a minute or
      # two, so retry for about 3 minutes. The blog has no ntfy topic, so a
      # failure opens a deploy-smoke issue and fails the job.
      - name: Post-deploy smoke
        id: smoke
        env:
          SMOKE_RETRIES: "9"
          SMOKE_RETRY_DELAY: "20"
        run: |
          bash scripts/deploy-smoke.sh check https://rkoripalli.github.io \
            /blog/=200 /blog/posts/=200 /blog/posts/lumber-rack/=200 /blog/tags/=200 \
            /blog/search/=200 /blog/search.json=200 /blog/index.xml=200 \
            /blog/sitemap-index.xml=200 /blog/nope=404

      - name: Report smoke failure
        if: failure() && steps.smoke.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/deploy-smoke.sh issue
